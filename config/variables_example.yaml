# Copy this file to config/variables.yaml and fill in local values.
# config/variables.yaml is ignored by Git. Do not put real passwords or API keys here.

DILIGENCE_ENV: local
DILIGENCE_STORAGE_BACKEND: local
DILIGENCE_DATA_ROOT: .data

# PostgreSQL defaults are aligned with the local macro_medallion convention.
DILIGENCE_POSTGRES_HOST: localhost
DILIGENCE_POSTGRES_PORT: 55432
DILIGENCE_POSTGRES_DB: IDP
DILIGENCE_POSTGRES_USER: postgres
DILIGENCE_POSTGRES_PASSWORD: ""
# Optional full connection string; leave blank to use the fields above.
DILIGENCE_POSTGRES_DSN: ""

# SEC requires an identifying User-Agent. Use an email address you control.
SEC_USER_AGENT: "investment-diligence-pipelines/0.1 you@example.com"
# Optional; OpenAlex works without a key. Supplying an email identifies the client.
OPENALEX_EMAIL: ""

# Required for live patent collection; leave blank for fixture-only tests.
USPTO_API_KEY: ""
# Configurable while the legacy PatentsView search API is unavailable.
USPTO_API_URL: "https://search.patentsview.org/api/v1/patent/"
# Optional local path or ODP download target for the bulk-data ingestion phase.
USPTO_BULK_DATA_URL: ""
# Current ODP catalog endpoint; use only with an ODP-compatible USPTO API key.
USPTO_ODP_CATALOG_URL: "https://api.uspto.gov/api/v1/datasets/products/search"
# Used by scheduled discovery; discovery does not download or ingest.
USPTO_ODP_PRODUCT_QUERY: "PatentsView"
USPTO_ODP_PRODUCT_IDENTIFIER: "PVGPATDIS"
USPTO_ODP_ARTIFACT_NAME: "g_patent.tsv.zip"
USPTO_ODP_DISCOVERY_OUTPUT: ".data/uspto/odp_discovery.json"
# Dagster's approved-refresh sensor reads this analyst-reviewed selection. The
# selection must have status "approved_for_download"; no sensor approves a release.
USPTO_ODP_REVIEWED_SELECTION: ".data/uspto/reviewed_selection.json"
USPTO_ODP_REFRESH_OUTPUT: ".data/uspto/g_patent.tsv.zip"
USPTO_ODP_PREVIOUS_FILE: ""
USPTO_ODP_REFRESH_MAX_AGE_DAYS: "45"

# Optional UN Comtrade connector settings for Pipeline 03.
# Preferred names when using two keys. The adapter tries primary first and
# falls back to secondary on authentication, quota, or rate-limit responses.
COMTRADE_API_KEY_PRIMARY: ""
COMTRADE_API_KEY_SECONDARY: ""
# Legacy single-key name; still supported as a fallback for primary.
COMTRADE_API_KEY: ""
COMTRADE_API_URL: "https://comtradeapi.un.org/public/v1/preview/C/A/HS"

# Pipeline 04 USAspending endpoints; no key required.
USASPENDING_AWARD_SEARCH_URL: "https://api.usaspending.gov/api/v2/search/spending_by_award/"
USASPENDING_TRANSACTIONS_URL: "https://api.usaspending.gov/api/v2/transactions/"

# Pipeline 05 GDELT DOC 2.0 endpoint; no key required. Keep request volume low.
GDELT_DOC_API_URL: "https://api.gdeltproject.org/api/v2/doc/doc"

# Pipeline 05 optional local LLM event extractor (Ollama-compatible server).
# Headlines are only sent to loopback hosts unless --llm-allow-remote is passed.
LLM_BASE_URL: "http://localhost:11434"
LLM_EVENT_MODEL: ""

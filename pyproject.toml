[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-diligence-pipelines"
version = "0.1.0"
description = "Source-backed data pipelines for investment diligence"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "certifi>=2024.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
diligence-pipelines = "diligence_pipelines.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
